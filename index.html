<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Kartu Memori</title>
</head>
<body>
    <div id = "halaman-awal" class = "halaman">
        <header>
            <h1>Kartu Memori</h1>
            <p class = "subjudul">Cari pasangan gambar yang sama!</p>
        </header>
        <main>
            <div class = "info-box">
                <p>Selamat datang :></p>
                <p>Di game pasang gambar tema buah-buahan!</p>
                <p>Selamat bermain, HAVE FUN!!</p>
            </div>
            <button id="btn-mulai" class="btn-utama">Mulai Main</button>
        </main>
    </div>

    <div id="halaman-game" class="halaman" style="display: none;">
        <header>
            <button id="btn-kembali" class="btn-teks">← Kembali</button>
            <h2>Cari Pasangan!</h2>
        </header>
        <main>
            <div class = "info-game">
                <p>Percobaan: <span id="skor">0</span></p>
                <p>Pasangan: <span id="pasangan">0</span> / ?</p>
            </div>

            <div id="papan" class="papan"></div>

            <button id="btn-reset" class="btn-utama">Ulangi</button>
        </main>
    </div>
    
</body>
</html>
